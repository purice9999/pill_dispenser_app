<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitorizare Pastile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: white;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    header .icon { font-size: 36px; }

    header h1 { font-size: 22px; font-weight: 700; }
    header p  { font-size: 13px; opacity: 0.8; margin-top: 2px; }

    .live-dot {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      opacity: 0.9;
    }

    .dot {
      width: 10px; height: 10px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(1.3); }
    }

    .container {
      max-width: 720px;
      margin: 32px auto;
      padding: 0 16px;
    }

    /* ─── STATISTICI ─── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }

    .stat-card .num {
      font-size: 36px;
      font-weight: 800;
      line-height: 1;
    }

    .stat-card .label {
      font-size: 12px;
      color: #64748b;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-total .num { color: #2563eb; }
    .stat-luata  .num { color: #16a34a; }
    .stat-neluata .num { color: #dc2626; }

    /* ─── LISTA EVENTS ─── */
    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #events-list { display: flex; flex-direction: column; gap: 10px; }

    .event-card {
      background: white;
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
      border-left: 5px solid transparent;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .event-card.luata   { border-left-color: #16a34a; }
    .event-card.neluata { border-left-color: #dc2626; }

    .event-icon {
      font-size: 28px;
      flex-shrink: 0;
    }

    .event-body { flex: 1; }

    .event-msg {
      font-size: 15px;
      font-weight: 600;
      color: #1e293b;
    }

    .event-time {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 3px;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge.luata   { background: #dcfce7; color: #15803d; }
    .badge.neluata { background: #fee2e2; color: #b91c1c; }

    /* ─── LOADING / EMPTY ─── */
    .placeholder {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
    }

    .placeholder .big { font-size: 48px; margin-bottom: 12px; }
    .placeholder p    { font-size: 15px; }

    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      text-align: center;
      padding: 32px 16px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<header>
  <div class="icon">💊</div>
  <div>
    <h1>Monitorizare Pastile</h1>
    <p>Istoric în timp real — dispozitiv PillDispenser</p>
  </div>
  <div class="live-dot">
    <div class="dot"></div>
    Live
  </div>
</header>

<div class="container">

  <!-- Statistici -->
  <div class="stats">
    <div class="stat-card stat-total">
      <div class="num" id="stat-total">—</div>
      <div class="label">Total</div>
    </div>
    <div class="stat-card stat-luata">
      <div class="num" id="stat-luata">—</div>
      <div class="label">Luate</div>
    </div>
    <div class="stat-card stat-neluata">
      <div class="num" id="stat-neluata">—</div>
      <div class="label">Neluate</div>
    </div>
  </div>

  <!-- Lista -->
  <div class="section-title">
    🕐 Ultimele evenimente
  </div>

  <div id="events-list">
    <div class="placeholder">
      <div class="spinner"></div>
      <p>Se încarcă datele...</p>
    </div>
  </div>

</div>

<footer>
  Actualizare automată în timp real &middot; PillDispenser &copy; 2025
</footer>

<!-- Firebase JS SDK (CDN) -->
<script type="module">
  import { initializeApp }     from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, orderBy, limit, onSnapshot }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ─── CONFIG Firebase (din GoogleService-Info.plist) ───────────────────────
  const firebaseConfig = {
    apiKey:            "AIzaSyC3aKsAJzqLwWYxpAfLczBKi-z5JOya2F8",
    projectId:         "pill-dispenser-2b76c",
    storageBucket:     "pill-dispenser-2b76c.firebasestorage.app",
    messagingSenderId: "1089992674991",
    appId:             "1:1089992674991:ios:4cffb0c79c43232c43ce5a",
  };
  // ──────────────────────────────────────────────────────────────────────────

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  const list = document.getElementById('events-list');
  const statTotal   = document.getElementById('stat-total');
  const statLuata   = document.getElementById('stat-luata');
  const statNeluata = document.getElementById('stat-neluata');

  // Ascultă în timp real ultimele 100 de evenimente
  const q = query(collection(db, 'history'), orderBy('timestamp', 'desc'), limit(100));

  onSnapshot(q, (snapshot) => {
    if (snapshot.empty) {
      list.innerHTML = `
        <div class="placeholder">
          <div class="big">📭</div>
          <p>Nu există niciun eveniment înregistrat încă.</p>
        </div>`;
      statTotal.textContent   = '0';
      statLuata.textContent   = '0';
      statNeluata.textContent = '0';
      return;
    }

    const docs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));

    // Statistici
    const luate   = docs.filter(d => d.type === 'luata').length;
    const neluate = docs.filter(d => d.type === 'neluata').length;
    statTotal.textContent   = docs.length;
    statLuata.textContent   = luate;
    statNeluata.textContent = neluate;

    // Render cards
    list.innerHTML = docs.map(doc => {
      const isLuata = doc.type !== 'neluata';
      const icon    = isLuata ? '✅' : '❌';
      const cls     = isLuata ? 'luata' : 'neluata';
      const badge   = isLuata ? 'Luată' : 'Neluată';
      const time    = doc.timestamp?.toDate
        ? formatDate(doc.timestamp.toDate())
        : '—';

      return `
        <div class="event-card ${cls}">
          <div class="event-icon">${icon}</div>
          <div class="event-body">
            <div class="event-msg">${escHtml(doc.message ?? 'Eveniment pastilă')}</div>
            <div class="event-time">${time}</div>
          </div>
          <span class="badge ${cls}">${badge}</span>
        </div>`;
    }).join('');
  }, (err) => {
    console.error('Firestore error:', err);
    list.innerHTML = `
      <div class="placeholder">
        <div class="big">⚠️</div>
        <p>Eroare la conectare. Verifică setările Firestore.</p>
        <p style="font-size:11px;margin-top:8px;color:#ef4444">${err.message}</p>
      </div>`;
  });

  function formatDate(date) {
    return date.toLocaleDateString('ro-RO', {
      day: '2-digit', month: 'long', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>

</body>
</html>
